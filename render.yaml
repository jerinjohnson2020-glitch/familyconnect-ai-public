services:
  - type: web
    name: familyconnect-ai
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_PUBLIC_URL
        sync: false
      - key: TRIAGE_MODEL_VERSION
        value: v2
